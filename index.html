<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bewdley Bootcamp — Week of 5 October</title>
<meta name="description" content="This week's training at Bewdley Bootcamp.">
<meta name="theme-color" content="#F5F2EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   BEWDLEY BOOTCAMP — WEEKLY PROGRAMME
   Palette per the handover sheet. Moss retired from the UI; contrast comes
   from forest-on-white and solid dark card heads. Classes namespaced .wk-*.
   ========================================================================== */
:root{
  --forest-deep:#1C2B1A; --forest-mid:#2D4A2B;
  --amber:#D4A843; --chalk:#E8E0D0; --off-white:#F5F2EC;

  --bg:var(--off-white); --surface:#FFFFFF;
  --ink:var(--forest-deep);
  --ink-muted:rgba(28,43,26,.78);      /* lifted from .68 for legibility */
  --ink-invert:var(--off-white);
  --ink-invert-muted:rgba(232,224,208,.82);
  --rule:rgba(28,43,26,.22);           /* lifted from .14 */
  --rule-soft:rgba(28,43,26,.11);
  --rule-invert:rgba(232,224,208,.22);

  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --fs-h1:clamp(2.5rem,7vw,4.25rem); --fs-h3:clamp(1.4rem,4.4vw,1.9rem);
  --fs-body:1rem; --fs-small:.875rem; --fs-eyebrow:.75rem;
  --lh-display:.95; --lh-body:1.6;
  --tracking-display:-0.01em; --tracking-eyebrow:.18em;

  --sp-1:.25rem; --sp-2:.5rem; --sp-3:.75rem; --sp-4:1rem;
  --sp-5:1.5rem; --sp-6:2rem; --sp-7:3rem; --sp-8:4rem;
  --wrap:1180px;
  --radius-sm:4px; --radius:8px;
  --shadow:0 1px 2px rgba(28,43,26,.06), 0 6px 20px rgba(28,43,26,.07);
  --ease:cubic-bezier(.2,.7,.3,1);
  --slash-angle:-4deg;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:var(--fs-body);line-height:var(--lh-body);
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
h1,h2,h3{margin:0 0 var(--sp-4);font-family:var(--font-display);font-weight:800;
  line-height:var(--lh-display);letter-spacing:var(--tracking-display);text-transform:uppercase}
p{margin:0 0 var(--sp-4)}
:focus-visible{outline:3px solid var(--amber);outline-offset:3px}

.bb-wrap{width:min(100% - 2.25rem,var(--wrap));margin-inline:auto}
.bb-eyebrow{display:inline-block;font-family:var(--font-body);font-size:var(--fs-eyebrow);
  font-weight:700;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--amber)}

/* ——— Masthead (light) ——— */
.wk-mast{padding:var(--sp-6) 0 var(--sp-5)}
.wk-mast__eyebrow{margin-bottom:var(--sp-2)}
.wk-mast__mark{font-family:var(--font-display);font-weight:900;text-transform:uppercase;
  font-size:clamp(2.2rem,9vw,3.6rem);line-height:.9;letter-spacing:var(--tracking-display);
  color:var(--forest-deep);margin:0}
.wk-mast__mark span{display:block}
.wk-mast__meta{margin:var(--sp-4) 0 0;padding-top:var(--sp-3);
  border-top:2px solid var(--forest-deep);
  font-size:var(--fs-small);font-weight:500;color:var(--ink-muted)}
.wk-mast__meta b{color:var(--forest-deep);font-weight:700}

/* ——— Day rail (light, sticky) ——— */
.wk-rail{position:sticky;top:0;z-index:30;background:var(--off-white);
  border-bottom:2px solid var(--forest-deep);padding:var(--sp-3) 0}
.wk-rail__track{display:flex;gap:var(--sp-2);overflow-x:auto;scrollbar-width:none;
  width:min(100% - 2.25rem,var(--wrap));margin-inline:auto}
.wk-rail__track::-webkit-scrollbar{display:none}
.wk-rail__tab{
  flex:0 0 auto;appearance:none;cursor:pointer;
  background:var(--surface);border:2px solid var(--rule);border-radius:var(--radius-sm);
  padding:.45rem .85rem .35rem;
  font-family:var(--font-display);font-weight:700;font-size:1.2rem;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted);
  transition:background-color .15s var(--ease),color .15s var(--ease),border-color .15s var(--ease);
}
.wk-rail__tab:hover{border-color:var(--forest-deep);color:var(--forest-deep)}
.wk-rail__tab[aria-selected="true"]{
  background:var(--forest-deep);border-color:var(--forest-deep);color:var(--off-white)}

/* ——— Session ——— */
.wk-day{padding:var(--sp-6) 0 var(--sp-6)}
.wk-day__eyebrow{color:var(--ink-muted);margin-bottom:var(--sp-2)}
.wk-day__title{font-size:var(--fs-h1);font-weight:900;margin-bottom:var(--sp-4);color:var(--forest-deep)}
.wk-day__tags{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:0 0 var(--sp-5);padding:0;list-style:none}
.wk-tag{font-size:var(--fs-small);font-weight:600;color:var(--forest-deep);
  background:var(--chalk);border-radius:999px;padding:.25rem .8rem}
.wk-tag--mark{background:var(--forest-deep);color:var(--off-white)}

/* ——— Blocks ——— */
.wk-block{background:var(--surface);border:2px solid var(--forest-deep);border-radius:var(--radius);
  box-shadow:var(--shadow);margin-bottom:var(--sp-5);overflow:hidden}
.wk-block__head{background:var(--forest-deep);color:var(--off-white);padding:var(--sp-3) var(--sp-4) var(--sp-4)}
.wk-block__label{margin-bottom:var(--sp-1)}
.wk-block__name{font-family:var(--font-display);font-weight:800;font-size:var(--fs-h3);
  text-transform:uppercase;letter-spacing:var(--tracking-display);line-height:1.02;
  margin:0;color:var(--off-white)}
.wk-block__how{margin:var(--sp-2) 0 0;font-size:var(--fs-small);font-weight:400;
  color:var(--ink-invert-muted);line-height:1.5}
.wk-list{list-style:none;margin:0;padding:0}
.wk-list__row{display:flex;justify-content:space-between;align-items:baseline;gap:var(--sp-4);
  padding:var(--sp-3) var(--sp-4);border-bottom:1px solid var(--rule-soft)}
.wk-list__row:last-child{border-bottom:0}
.wk-list__move{font-weight:600;color:var(--forest-deep)}
.wk-list__pos{display:inline-block;min-width:1.5rem;font-weight:700;color:var(--forest-deep);
  background:var(--chalk);border-radius:var(--radius-sm);text-align:center;
  padding:0 .35rem;margin-right:.5rem;font-size:var(--fs-small)}
.wk-list__sub{display:block;font-size:var(--fs-small);font-weight:400;color:var(--ink-muted)}
.wk-list__pre{text-align:right;white-space:nowrap;font-weight:700;color:var(--forest-deep);
  font-variant-numeric:tabular-nums}
.wk-list__note{display:block;font-size:var(--fs-small);font-weight:500;color:var(--ink-muted)}
.wk-block__foot{margin:0;padding:var(--sp-3) var(--sp-4);background:var(--chalk);
  font-size:var(--fs-small);font-weight:500;color:var(--forest-deep);border-top:2px solid var(--forest-deep)}
.wk-block__foot b{font-weight:700}

/* ——— Tempo decoder ——— */
.wk-tempo{appearance:none;background:none;border:0;cursor:pointer;padding:0 0 0 .4rem;
  display:inline-flex;gap:2px;align-items:flex-end;height:14px;vertical-align:-2px}
.wk-tempo span{width:4px;border-radius:1px;background:var(--forest-deep)}
.wk-tempo__key{margin:0;padding:var(--sp-3) var(--sp-4);background:var(--chalk);
  border-top:1px solid var(--rule);font-size:var(--fs-small);color:var(--forest-deep)}
.wk-tempo__key[hidden]{display:none}
.wk-tempo__key dt{float:left;clear:left;width:1.7rem;font-weight:700}
.wk-tempo__key dd{margin:0 0 .2rem 1.7rem;color:var(--ink-muted)}
.wk-tempo__key dd b{color:var(--forest-deep);font-weight:700}

/* ——— Rest ——— */
.wk-rest{background:var(--surface);border:2px dashed var(--rule);border-radius:var(--radius);
  padding:var(--sp-7) var(--sp-5);text-align:center}
.wk-rest h3{color:var(--forest-deep);margin-bottom:var(--sp-2)}
.wk-rest p{margin:0;color:var(--ink-muted);font-weight:500}

/* ——— Glossary ——— */
.wk-gloss{background:var(--surface);border:2px solid var(--forest-deep);border-radius:var(--radius);
  padding:var(--sp-4);margin-bottom:var(--sp-4)}
.wk-gloss summary{cursor:pointer;list-style:none;font-family:var(--font-display);font-weight:800;
  font-size:1.4rem;text-transform:uppercase;letter-spacing:var(--tracking-display);
  color:var(--forest-deep);display:flex;justify-content:space-between;align-items:center}
.wk-gloss summary::-webkit-details-marker{display:none}
.wk-gloss summary::after{content:'+';font-weight:700}
.wk-gloss[open] summary::after{content:'–'}
.wk-gloss dl{margin:var(--sp-4) 0 0;font-size:var(--fs-small)}
.wk-gloss dt{font-weight:700;color:var(--forest-deep);margin-top:var(--sp-3)}
.wk-gloss dd{margin:0;color:var(--ink-muted);font-weight:400}

/* ——— Log weights CTA ——— */
.wk-cta{display:block;width:100%;text-align:center;
  margin:var(--sp-2) 0 var(--sp-4);
  padding:1rem 1.9rem;border:2px solid var(--amber);border-radius:var(--radius-sm);
  background:var(--amber);color:var(--forest-deep);text-decoration:none;
  font-family:var(--font-display);font-size:1.25rem;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;
  transition:transform .18s var(--ease),background-color .18s var(--ease)}
.wk-cta:hover{background:#E0B855;transform:translateY(-2px)}
.wk-cta__sub{display:block;font-family:var(--font-body);font-size:var(--fs-eyebrow);
  font-weight:600;letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;
  opacity:.72;margin-top:.15rem}
@media (prefers-reduced-motion:reduce){.wk-cta:hover{transform:none}}

.wk-cta--top{width:auto;display:inline-block;margin:var(--sp-4) 0 0;
  padding:.7rem 1.4rem;font-size:1.05rem;
  background:var(--forest-deep);border-color:var(--forest-deep);color:var(--off-white)}
.wk-cta--top:hover{background:var(--forest-mid);border-color:var(--forest-mid)}

/* ——— Signature: slash marquee ——— */
.bb-marquee{overflow:hidden;background:var(--amber);transform:rotate(var(--slash-angle)) scale(1.06);
  padding:var(--sp-3) 0;margin:var(--sp-7) 0 var(--sp-6);user-select:none}
.bb-marquee__track{display:flex;width:max-content;gap:var(--sp-5);animation:bb-marquee-scroll 28s linear infinite}
.bb-marquee__item{font-family:var(--font-display);font-size:clamp(1.25rem,2.6vw,1.85rem);
  font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--forest-deep);white-space:nowrap}
.bb-marquee__item::after{content:'/';margin-left:var(--sp-5);opacity:.45}
@keyframes bb-marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ——— Footer ——— */
.wk-foot{background:var(--forest-deep);color:var(--ink-invert-muted);
  padding:var(--sp-6) 0;font-size:var(--fs-small);font-weight:400}
.wk-foot b{color:var(--off-white);font-family:var(--font-display);font-weight:800;
  font-size:1.2rem;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:var(--sp-1)}

@media (prefers-reduced-motion:reduce){
  .bb-marquee__track{animation:none}
  *{transition:none!important}
}
@media (min-width:640px){
  .wk-block__head{padding:var(--sp-4) var(--sp-5)}
  .wk-list__row,.wk-block__foot,.wk-tempo__key{padding-inline:var(--sp-5)}
}
</style>
</head>
<body>

<header class="wk-mast">
  <div class="bb-wrap">
    <span class="bb-eyebrow wk-mast__eyebrow">This week's training</span>
    <h1 class="wk-mast__mark"><span>Bewdley</span><span>Bootcamp</span></h1>
    <p class="wk-mast__meta">Week of <b id="wk-range">Mon 5 – Sun 11 Oct</b> · <span id="wk-count"></span></p>
    <a class="wk-cta wk-cta--top" id="wk-track-top" href="#" target="_blank" rel="noopener">Click Here to Log Your Weights</a>
  </div>
</header>

<nav class="wk-rail" aria-label="Choose a day">
  <div class="wk-rail__track" id="wk-rail" role="tablist"></div>
</nav>

<main class="bb-wrap" id="wk-day" role="tabpanel" aria-live="polite"></main>

<div class="bb-wrap">
  <details class="wk-gloss">
    <summary>Shorthand</summary>
    <dl id="wk-gloss"></dl>
  </details>
</div>

<div class="bb-marquee" aria-hidden="true">
  <div class="bb-marquee__track">
    <span class="bb-marquee__item">Strength</span>
    <span class="bb-marquee__item">Conditioning</span>
    <span class="bb-marquee__item">Mobility</span>
    <span class="bb-marquee__item">Strength</span>
    <span class="bb-marquee__item">Conditioning</span>
    <span class="bb-marquee__item">Mobility</span>
  </div>
</div>

<footer class="wk-foot">
  <div class="bb-wrap">
    <b>Bewdley Bootcamp</b>
    Scale the loads to suit you. Ask a coach if anything here isn't clear.
  </div>
</footer>

<script>
/* =======================================================================
   WEEK DATA — the only thing that changes week to week.
   Replace this object and the page rebuilds itself.
   ======================================================================= */
const WEEK = {
  trackUrl:"https://track.bewdleybootcamp.co.uk",
  range:"Mon 5 – Sun 11 Oct",
  days:[
    { day:"Mon", date:"5 Oct", kindLabel:"Strength",
      title:"Pause Squats + 4 Rounds",
      tags:["Barbell · Dumbbells · Kettlebells","Pause work"],
      blocks:[
        { label:"Block A", name:"Back Squats", how:"Three sets of three. Two second pause at the bottom, no bounce.",
          moves:[{name:"Back Squat", sub:"2 second pause", pre:"3 × 3", note:"60% of 1RM"}],
          foot:"<b>The light bar is the point.</b> The pause is doing the work, not the weight."},
        { label:"Block B", name:"4 Rounds", how:"Work through all four, then rest.",
          moves:[
            {pos:"1", name:"Run", pre:"400m"},
            {pos:"2", name:"DB Bench Press", pre:"× 12"},
            {pos:"3", name:"KB Gorilla Rows", pre:"× 12"},
            {pos:"4", name:"Low Plank", pre:"40s"}
          ],
          foot:"<b>90 seconds rest between rounds.</b>"}
      ]},

    { day:"Tue", date:"6 Oct", kindLabel:"Bootcamp 45",
      title:"Gymnastics + Partner Ladder",
      tags:[{text:"Back to School · 11/12",mark:true},"45 minutes","Bodyweight · Bands"],
      blocks:[
        { label:"Skill", name:"Gymnastics — 3 Options", how:"Three sets. Pick the option that fits where you're at.",
          moves:[
            {pos:"1", name:"Wall Walk + Hold", sub:"10 second hold at the top", pre:"3 sets"},
            {pos:"2", name:"Head Stand Kick Ups", pre:"3 sets"},
            {pos:"3", name:"Hand Stand Kick Ups", pre:"3 sets"}
          ]},
        { label:"Also", name:"Pike Press Ups",
          moves:[{name:"Pike Press Ups", pre:"3 × 3"}]},
        { label:"Main piece", name:"For Time — In Pairs", how:"30, then 20, then 10 of each. One partner completes the whole round before the other starts.",
          moves:[
            {pos:"1", name:"Resistance Band Curls", pre:"30-20-10"},
            {pos:"2", name:"Walking Lunges", pre:"30-20-10"},
            {pos:"3", name:"Russian Twists", pre:"30-20-10"}
          ],
          foot:"<b>Partner 1 does the full round of 30s, then partner 2.</b> Then both through the 20s, then the 10s. 180 reps each by the end."}
      ]},

    { day:"Wed", date:"7 Oct", kindLabel:"Conditioning",
      title:"Four Stations",
      tags:["Rower · Sled · Box","Stations round the gym"],
      blocks:[
        { label:"Format", name:"One At A Time", how:"Stations are spread around the gym. Finish one, rest 2–3 minutes, then on to the next.",
          moves:[
            {pos:"1", name:"Row", pre:"50 cals"},
            {pos:"2", name:"Body Rows", pre:"× 75"},
            {pos:"3", name:"Sled Push", pre:"100m"},
            {pos:"4", name:"Box Step Ups", pre:"× 125"}
          ],
          foot:"<b>Rest 2–3 minutes between stations.</b> The numbers climb as you go — pace the rower or the step ups will hurt."}
      ]},

    { day:"Thu", date:"8 Oct", kindLabel:"Bootcamp 45",
      title:"Final Session",
      tags:[{text:"Back to School · 12/12",mark:true},"Last of the block","45 minutes"],
      blocks:[
        { label:"Main piece", name:"AMRAP 12 Minutes", how:"Eight reps of everything. Keep the rounds ticking over.",
          moves:[
            {pos:"1", name:"DB RDLs", pre:"× 8"},
            {pos:"2", name:"Press Ups", pre:"× 8"},
            {pos:"3", name:"KB Swings", pre:"× 8"},
            {pos:"4", name:"Abmat Sit Ups", pre:"× 8"}
          ],
          foot:"<b>Last session of Back to School.</b> Twelve weeks in — every movement here is one you've built across the block. Write the score down."}
      ]},

    { day:"Fri", date:"9 Oct", kindLabel:"Test Day",
      title:"3 Rep Max",
      tags:[{text:"Retest · vs 3 Aug",mark:true},"Barbell","Build to a heavy triple"],
      blocks:[
        { label:"Lift 1", name:"Back Squat", how:"Build to the heaviest three you can hold good depth and shape on.",
          moves:[{name:"Back Squat", pre:"3 Rep Max"}]},
        { label:"Lift 2", name:"Overhead Press", how:"Same again — heaviest honest triple.",
          moves:[{name:"Overhead Press", pre:"3 Rep Max"}]},
        { label:"After", name:"Compare",
          moves:[{name:"Check against 3 August", sub:"Same two lifts, same test", pre:"Log it"}],
          foot:"<b>Both numbers go in the tracker.</b> This is what the last nine weeks of percentage work was for — the percentages from here run off today's number."}
      ]},

    { day:"Sat", date:"10 Oct", kindLabel:"Strength",
      title:"Bent Over Row + Blocks",
      tags:["Barbell · Dumbbells · Kettlebells","9 minutes of work"],
      blocks:[
        { label:"Block A", name:"Barbell Bent Over Row", how:"Descending reps — 8, 6, 4, 4. Add weight as they come down.",
          moves:[{name:"Barbell Bent Over Row", pre:"8-6-4-4"}]},
        { label:"Block B", name:"9 Minutes — 3 Blocks", how:"Three minutes on each pair, alternating between the two for the whole block.",
          moves:[
            {pos:"0-3", name:"Inch Worms", pre:"× 3"},
            {pos:"0-3", name:"KB SDLHP", pre:"× 10"},
            {pos:"3-6", name:"DB Single Arm Row", sub:"Each side", pre:"× 5"},
            {pos:"3-6", name:"KB Pull Throughs", pre:"× 10"},
            {pos:"6-9", name:"Burpees", pre:"× 3"},
            {pos:"6-9", name:"Air Squats", pre:"× 10"}
          ],
          foot:"<b>Keep alternating within each three-minute block</b> — as many times through the pair as you can, then straight into the next pair."}
      ]},

    { day:"Sun", date:"11 Oct", kindLabel:"Run Club", title:"Rise Up Run Club",
      rest:true, restTitle:"Rise Up Run Club",
      restNote:"Starts 9.30am" }
  ],
  glossary:[
    ["3 Rep Max","The heaviest three reps you can do with the form holding. Not a grind — if the third rep breaks down, that's not your number."],
    ["2s pause","Hold still at the bottom for two full seconds before standing. No bounce out of the hole."],
    ["YGIG","You go, I go. One partner works while the other rests, then you swap."],
    ["AMRAP","As many rounds as possible in the time given."],
    ["30-20-10","Three rounds with the reps coming down each time."],
    ["SDLHP","Sumo deadlift high pull. Wide stance, pull from the floor to under the chin, elbows leading."],
    ["Inch Worm","Hands to the floor, walk out to a plank, walk the feet back in."],
    ["Pull Throughs","Bell on the floor between your feet, hinge and pass it behind and through from hand to hand."],
    ["Wall Walk","Feet on the wall, hands walking in towards it until you're near vertical. Hold, then walk back out."],
    ["RDL","Romanian deadlift. Push the hips back with soft knees."]
  ]
};

/* ——— Render ——— */
const rail=document.getElementById('wk-rail'), panel=document.getElementById('wk-day');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

document.getElementById('wk-range').textContent=WEEK.range;
document.getElementById('wk-track-top').href=WEEK.trackUrl;
document.getElementById('wk-count').textContent=WEEK.days.filter(d=>!d.rest).length+' sessions';

const todayIdx=0;   // opens on Monday. For today's day instead:
// const todayIdx=(()=>{const j=new Date().getDay();return j===0?6:j-1;})();

WEEK.days.forEach((d,i)=>{
  const b=document.createElement('button');
  b.className='wk-rail__tab';b.type='button';b.setAttribute('role','tab');
  b.setAttribute('aria-selected',i===todayIdx);
  b.textContent=d.day;
  b.addEventListener('click',()=>select(i));
  rail.appendChild(b);
});

function tempoBtn(code){
  const h={'3':11,'2':9,'1':5,'0':3,'X':14};
  return '<button type="button" class="wk-tempo" aria-label="Explain tempo '+code+'">'
    + [...code].map(c=>'<span style="height:'+(h[c]||5)+'px"></span>').join('') + '</button>';
}
function tempoKey(code){
  const stage=['Lowering','Bottom','Lifting','Top'];
  const say={'3':'three seconds down','2':'two seconds down','1':'hold for one second',
             '0':'no pause','X':'drive up as fast as you can'};
  return '<dl class="wk-tempo__key" hidden><p style="margin:0 0 .5rem"><b>Tempo '+code
    +'</b> — four numbers, four parts of every rep.</p>'
    + [...code].map((c,n)=>'<dt>'+c+'</dt><dd><b>'+stage[n]+'</b> — '+say[c]+'</dd>').join('')+'</dl>';
}

function select(i){
  const d=WEEK.days[i];
  [...rail.children].forEach((t,n)=>t.setAttribute('aria-selected',n===i));

  let h='<section class="wk-day">'
    + '<span class="bb-eyebrow wk-day__eyebrow">'+d.day+' '+d.date+' — '+d.kindLabel+'</span>'
    + '<h2 class="wk-day__title">'+esc(d.title)+'</h2>';

  if(d.rest){
    panel.innerHTML=h+'<div class="wk-rest"><h3>'+esc(d.restTitle||'Nothing on today')+'</h3>'
      +'<p>'+esc(d.restNote||'Walk, stretch, eat well. Back at it tomorrow.')+'</p></div></section>';
    return;
  }

  if(d.tags){
    h+='<ul class="wk-day__tags">'+d.tags.map(t=>{
      const o=typeof t==='string'?{text:t}:t;
      return '<li class="wk-tag'+(o.mark?' wk-tag--mark':'')+'">'+esc(o.text)+'</li>';
    }).join('')+'</ul>';
  }

  d.blocks.forEach(bl=>{
    let code='';
    h+='<article class="wk-block"><div class="wk-block__head">'
      + '<span class="bb-eyebrow wk-block__label">'+esc(bl.label)+'</span>'
      + '<h3 class="wk-block__name">'+esc(bl.name)+'</h3>'
      + (bl.how?'<p class="wk-block__how">'+esc(bl.how)+'</p>':'')
      + '</div><ul class="wk-list">';
    bl.moves.forEach(m=>{
      if(m.tempo) code=m.tempo;
      h+='<li class="wk-list__row"><span class="wk-list__move">'
        + (m.pos?'<span class="wk-list__pos">'+esc(m.pos)+'</span>':'')+esc(m.name)
        + (m.sub?'<span class="wk-list__sub">'+esc(m.sub)+'</span>':'')+'</span>'
        + '<span class="wk-list__pre">'+esc(m.pre)
        + (m.note?'<span class="wk-list__note">'+esc(m.note)+(m.tempo?tempoBtn(m.tempo):'')+'</span>':'')
        + '</span></li>';
    });
    h+='</ul>';
    if(code) h+=tempoKey(code);
    if(bl.foot) h+='<p class="wk-block__foot">'+bl.foot+'</p>';
    h+='</article>';
  });

  h+='<a class="wk-cta" href="'+WEEK.trackUrl+'" target="_blank" rel="noopener">'
    + 'Click Here to Log Your Weights<span class="wk-cta__sub">'+d.day+' '+d.date+'</span></a>';

  panel.innerHTML=h+'</section>';
  panel.querySelectorAll('.wk-tempo').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const key=btn.closest('.wk-block').querySelector('.wk-tempo__key');
      if(key) key.hidden=!key.hidden;
    });
  });
}

document.getElementById('wk-gloss').innerHTML=
  WEEK.glossary.map(([t,d])=>'<dt>'+esc(t)+'</dt><dd>'+esc(d)+'</dd>').join('');

select(todayIdx);
rail.children[todayIdx].scrollIntoView({inline:'center',block:'nearest'});
</script>
</body>
</html>
